- question: "Сколько сделок было заключено в июле 2024 года?"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2024, month_from: 7}}
- question: "Сколько сделок было в марте 2024 года?"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2024, month_from: 3}}
- question: "2023-yil mart oyida nechta bitim tuzilgan?"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2023, month_from: 3}}
- question: "Сколько сделок было во втором квартале 2025 года?"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2025, month_from: 4, month_to: 6}}
- question: "Какая общая сумма сделок в 2023 году?"
  spec: {kind: deals_aggregate, measures: [amount_uzs], filters: {year: 2023}}
- question: "Какова стоимость экспортных сделок в долларах за 2024 год?"
  spec: {kind: deals_aggregate, measures: [amount_usd], filters: {year: 2024, contract_type: Экспортный}}
- question: "Какая компания купила больше всего карбамида?"
  note: "resolve(product, карбамид) → Карбамид; мерило не указано → объём и сумма"
  spec: {kind: deals_aggregate, measures: [volume_tonnes, amount_uzs], group_by: buyer, filters: {products: [Карбамид]}}
- question: "Paxta xom ashyosini eng ko‘p sotib olgan kompaniya qaysi?"
  note: "resolve(product, paxta xom ashyosi) → Хлопок-сырец"
  spec: {kind: deals_aggregate, measures: [volume_tonnes, amount_uzs], group_by: buyer, filters: {products: [Хлопок-сырец]}}
- question: "Кто больше всех продал цемента по сумме в 2023 году?"
  spec: {kind: deals_aggregate, measures: [amount_uzs], group_by: seller, top: 3, filters: {year: 2023, products: [Портландцемент]}}
- question: "Какая компания больше всего торговала в 2023 году?"
  note: "роль не указана → покупатели и продавцы отдельно"
  spec: {kind: deals_aggregate, measures: [deal_count, amount_uzs], group_by: participant, filters: {year: 2023}}
- question: "Кто был брокером по сделке 412000?"
  spec: {kind: deal_lookup, deal_id: 412000}
- question: "101800-shartnoma bo‘yicha sotuvchi va brokerlar kim?"
  spec: {kind: contract_lookup, contract_id: 101800}
- question: "Какой брокер обслужил сделки на наибольшую сумму в 2024 году?"
  spec: {kind: deals_aggregate, measures: [amount_uzs], group_by: broker, filters: {year: 2024}}
- question: "BK045 broker 2025-yilda nechta bitimda qatnashgan?"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2025, brokers: [BK045]}}
- question: "Какой брокер покупателей провёл больше всего сделок в 2023?"
  spec: {kind: deals_aggregate, measures: [deal_count], group_by: buyer_broker, filters: {year: 2023}}
- question: "Какой был курс доллара 01.03.2025?"
  spec: {kind: usd_rate, date: "2025-03-01"}
- question: "2024-yil fevral oyida o‘rtacha dollar kursi qancha bo‘lgan?"
  spec: {kind: usd_rate, year: 2024, month: 2}
- question: "Сколько дизельного топлива продано в 2023 году?"
  note: "дизель в литрах → volume по unit"
  spec: {kind: deals_aggregate, measures: [volume], filters: {year: 2023, products: [Дизельное топливо]}}
- question: "Средняя цена хлопка-сырца за килограмм в 2024 году?"
  spec: {kind: deals_aggregate, measures: [avg_price_uzs_per_kg], status_scope: valid, filters: {year: 2024, products: [Хлопок-сырец]}}
- question: "Какая доля сделок была аннулирована в 2023 году?"
  spec: {kind: deals_aggregate, measures: [cancelled_pct, deal_count], status_scope: all, filters: {year: 2023}}
- question: "Qaysi viloyatda 2025-yilda eng ko‘p bitim tuzilgan?"
  spec: {kind: deals_aggregate, measures: [deal_count], group_by: region, filters: {year: 2025}}
- question: "Сколько сделок по цементу было в Самаркандской области в 2024?"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2024, products: [Портландцемент], regions: [Samarqand viloyati]}}
- question: "Сколько продано хлопковой продукции (масло, шрот, пряжа, сырец) в 2025 по сумме?"
  spec: {kind: deals_aggregate, measures: [amount_uzs], group_by: product, top: 10, filters: {year: 2025, product_family: Хлопок}}
- question: "Как менялось число сделок по месяцам в 2024 году?"
  spec: {kind: deals_aggregate, measures: [deal_count], group_by: month, filters: {year: 2024}}
- question: "Сколько сделок исполнено частично в 2023 году и сколько лотов поставлено?"
  spec: {kind: deals_aggregate, measures: [deal_count, lots_delivered], status_scope: all, filters: {year: 2023, statuses: ["Исполнен(Частично)"]}}
- question: "Сколько покупателей зарегистрировано в реестре?"
  spec: {kind: registry_count, entity: participants, role: Покупатель}
- question: "Какие сделки заключались на бирже до 2022 года, например в 2019-м?"
  action: declare_unanswerable
  note: "данные начинаются 03.01.2022"
- question: "Сколько сделок было в 2022 году?"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2022}}
- question: "2026-yilda nechta bitim tuzilgan?"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2026}}
- question: "Какая прибыль у компании Pudexiz Plast?"
  action: declare_unanswerable
  note: "прибыли в данных нет"
- question: "Какой средний срок поставки по форвардным контрактам?"
  note: "нет шаблона → submit_sql"
  sql: "SELECT AVG(delivery_term_days) AS avg_delivery_term_days, COUNT(*) AS contracts FROM contracts WHERE contract_form = 'Форвард'"
- question: "Какая самая крупная сделка 2024 года?"
  spec: {kind: deals_aggregate, measures: [amount_uzs], group_by: deal, top: 1, filters: {year: 2024}}
- question: "2024-yildagi eng katta bitim qaysi?"
  spec: {kind: deals_aggregate, measures: [amount_uzs], group_by: deal, top: 1, filters: {year: 2024}}
- question: "Сколько компаний-продавцов с видом деятельности «Кластер» в реестре?"
  spec: {kind: registry_count, entity: participants, activity: Кластер, role: Продавец}
- question: "Какой продавец продал меньше всего карбамида по сумме в 2024 году?"
  note: "меньше всего → order asc"
  spec: {kind: deals_aggregate, measures: [amount_uzs], group_by: seller, top: 1, order: asc, filters: {year: 2024, products: [Карбамид]}}
- question: "Когда была самая дешёвая сделка по портландцементу за тонну в 2023 году?"
  note: "одна сделка → group_by deal; цена за тонну сделки, по возрастанию"
  spec: {kind: deals_aggregate, measures: [mean_deal_price_uzs_per_t], group_by: deal, top: 1, order: asc, status_scope: valid, filters: {year: 2023, products: [Портландцемент]}}
- question: "Какая средняя цена портландцемента в 2024 году?"
  note: "не сказано взвешенная или простая → обе меры (price_average)"
  spec: {kind: deals_aggregate, measures: [avg_price_uzs_per_kg, mean_deal_price_uzs_per_t], status_scope: valid, filters: {year: 2024, products: [Портландцемент]}}
- question: "2025-yilda bug‘doyning mediana narxi (1 kg uchun) qancha bo‘lgan?"
  spec: {kind: deals_aggregate, measures: [median_price_uzs_per_kg], status_scope: valid, filters: {year: 2025, products: [Пшеница]}}
- question: "Сколько различных покупателей было у хлопка-сырца в 2023 году?"
  note: "сколько различных → distinct-мера без group_by"
  spec: {kind: deals_aggregate, measures: [distinct_buyers], filters: {year: 2023, products: [Хлопок-сырец]}}
- question: "2024-yilda nechta turli hududda bitim tuzilgan?"
  spec: {kind: deals_aggregate, measures: [distinct_regions], filters: {year: 2024}}
- question: "Какая доля форвардных сделок среди всех сделок 2024 года?"
  note: "знаменатель — все сделки, включая аннулированные"
  spec: {kind: deals_aggregate, measures: [share_pct, deal_count], share_of: {field: contract_form, value: Форвард}, filters: {year: 2024}}
- question: "Kaustik soda bo‘yicha bitimlarning necha foizi «Исполнен» holatida?"
  spec: {kind: deals_aggregate, measures: [share_pct], share_of: {field: status, value: Исполнен}, filters: {products: [Сода каустическая]}}
- question: "Как изменилась сумма сделок по хлопку-сырцу в первом квартале 2025 года по сравнению с первым кварталом 2024?"
  spec: {kind: deals_aggregate, measures: [amount_uzs], filters: {products: [Хлопок-сырец]}, compare_periods: [{year: 2024, month_from: 1, month_to: 3}, {year: 2025, month_from: 1, month_to: 3}]}
- question: "На какую сумму купили компании, зарегистрированные в Самаркандской области, в 2024 году?"
  note: "регион регистрации покупателя → buyer_regions (resolve region), не регион склада"
  spec: {kind: deals_aggregate, measures: [amount_uzs], filters: {year: 2024, buyer_regions: [Samarqand viloyati]}}
- question: "Сколько сделок по нефтепродуктам было в 2025 году?"
  note: "категория из каталога значений"
  spec: {kind: deals_aggregate, measures: [deal_count], filters: {year: 2025, categories: [Нефтепродукты]}}
- question: "Сколько тонн сахара-песка (именно это наименование) продано в 2024 году?"
  note: "конкретное написание → resolve(product_variant) → САХАР-ПЕСОК"
  spec: {kind: deals_aggregate, measures: [volume_tonnes], filters: {year: 2024, product_variants: [САХАР-ПЕСОК]}}
- question: "Сколько тонн хлопка-сырца (спот) продано в 2024 году?"
  note: "«(спот)» в названии → contract_form=Спот"
  spec: {kind: deals_aggregate, measures: [volume_tonnes], filters: {year: 2024, products: [Хлопок-сырец], contract_form: Спот}}
- question: "Сколько хлопка-сырца продано во всех формах (спот, форвард, фьючерс) в 2023 году?"
  note: "все формы → без contract_form, не product_family"
  spec: {kind: deals_aggregate, measures: [volume_tonnes], filters: {year: 2023, products: [Хлопок-сырец]}}
- question: "В скольких сделках брокер BK045 был брокером продавца и в скольких брокером покупателя в 2024 году?"
  spec: {kind: deals_aggregate, measures: [deal_count], group_by: broker_side, filters: {year: 2024, brokers: [BK045]}}
- question: "Кто продавец и покупатель самой крупной сделки по карбамиду в 2025 году?"
  spec: {kind: deals_aggregate, measures: [amount_uzs], group_by: deal, top: 1, status_scope: valid, filters: {year: 2025, products: [Карбамид]}}
- question: "STIR 915688255 bo‘lgan kompaniya qaysi hududda ro‘yxatdan o‘tgan?"
  spec: {kind: participant_lookup, inn: "915688255"}
- question: "В каком регионе находится брокер BK027 и сколько у него сделок?"
  spec: {kind: broker_lookup, broker_code: BK027}
- question: "Когда в 2024 году был самый высокий курс доллара?"
  spec: {kind: usd_rate, year: 2024, extreme: max}
- question: "Какая средняя просрочка поставки (в днях) по поставкам с опозданием в 2024 году и сколько их?"
  spec: {kind: deals_aggregate, measures: [avg_delivery_delay_days, late_delivery_count], status_scope: valid, filters: {year: 2024}}
- question: "В какой час дня заключается больше всего сделок?"
  spec: {kind: deals_aggregate, measures: [deal_count], group_by: hour, top: 1, status_scope: valid}
- question: "Сколько контрактов на карбамид действовало на 01.05.2024?"
  spec: {kind: registry_count, entity: contracts, products: [Карбамид], active_on: "2024-05-01"}
