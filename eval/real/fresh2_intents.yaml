- id: g039
  split: fresh2
  subject: brokers
  shape: top_n
  answerable: true
  intent: Top 3 brokers by number of 2024 deals, excluding annulled (as seller's broker, or on either side, each deal counted once per broker)
  readings:
  - name: seller's broker
    sql: |
      SELECT d.seller_broker, b.name, COUNT(*) AS deals FROM deals d LEFT JOIN brokers b ON b.broker_code = d.seller_broker
      WHERE d.year = 2024 AND NOT d.is_cancelled GROUP BY d.seller_broker, b.name ORDER BY deals DESC LIMIT 3
    key: [seller_broker, deals]
    sql_check: |
      SELECT seller_broker, COUNT(deal_id) AS deals FROM deals
      WHERE deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31' AND status <> 'Аннулирован(Не оплачен)'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 3
  - name: either side
    sql: |
      SELECT broker, COUNT(*) AS deals FROM (
        SELECT deal_id, seller_broker AS broker FROM deals WHERE year = 2024 AND NOT is_cancelled
        UNION SELECT deal_id, buyer_broker FROM deals WHERE year = 2024 AND NOT is_cancelled)
      GROUP BY broker ORDER BY deals DESC LIMIT 3
    key: [broker, deals]
    sql_check: |
      SELECT b.broker_code AS broker, COUNT(*) AS deals FROM brokers b JOIN deals d
        ON d.seller_broker = b.broker_code OR d.buyer_broker = b.broker_code
      WHERE d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31' AND d.status <> 'Аннулирован(Не оплачен)'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 3
  questions:
    ru: Какие три брокера были самыми загруженными в 2024 году по числу сделок (без аннулированных)?
    uz_latn: 2024-yilda bitimlar soni bo‘yicha eng band uchta broker qaysilar (bekor qilinganlarsiz)?
    uz_cyrl: 2024 йилда битимлар сони бўйича энг банд учта брокер қайсилар (бекор қилинганларсиз)?

