    uz_latn: 2023-yilda birjada nechta turli kompaniya sotuvchi sifatida qatnashgan?
    uz_cyrl: 2023 йилда биржада нечта турли компания сотувчи сифатида қатнашган?

- id: g013
  split: fresh2
  subject: deals
  shape: compare_periods
  answerable: true
  intent: Tonnes of petroleum bitumen sold in Q3 2024 versus Q3 2025, excluding annulled, and the change in %
  readings:
  - name: tonnes q3
    sql: |
      SELECT SUM(volume_tonnes) FILTER (WHERE year = 2024) AS q3_2024, SUM(volume_tonnes) FILTER (WHERE year = 2025) AS q3_2025,
             100.0 * SUM(volume_tonnes) FILTER (WHERE year = 2025) / SUM(volume_tonnes) FILTER (WHERE year = 2024) - 100 AS change_pct
      FROM deals WHERE product_canonical = 'Битум нефтяной' AND year IN (2024, 2025) AND quarter = 3 AND NOT is_cancelled
    key: [q3_2024, q3_2025]
    sql_check: |
      SELECT SUM(CASE WHEN d.deal_date BETWEEN DATE '2024-07-01' AND DATE '2024-09-30' THEN d.quantity * d.lot END) AS q3_2024,
             SUM(CASE WHEN d.deal_date BETWEEN DATE '2025-07-01' AND DATE '2025-09-30' THEN d.quantity * d.lot END) AS q3_2025
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Битум нефтяной' AND d.unit = 'тонна' AND d.status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: Битума продали в третьем квартале 2025 больше или меньше, чем в третьем квартале 2024, и на сколько процентов? В тоннах, аннулированные не считаем
    uz_latn: Neft bitumi 2025-yil uchinchi choragida 2024-yilning uchinchi choragiga qaraganda ko‘proqmi yoki kamroq sotilgan, necha foizga? Tonnada, bekor bo‘lganlarsiz
    uz_cyrl: Нефть битуми 2025 йил учинчи чоракда 2024 йилнинг учинчи чорагига қараганда кўпроқми ёки камроқ сотилган, неча фоизга? Тоннада, бекор бўлганларсиз

- id: g014
  split: fresh2
  subject: deals
  shape: trend
  answerable: true
  intent: 'Tonnes of rice sold in each year 2022–2026 (status not specified: all deals, or without annulled; 2026 up to 30 October)'
  readings:
  - name: all deals
    sql: |
      SELECT year, SUM(volume_tonnes) AS tonnes FROM deals WHERE product_canonical = 'Рис' GROUP BY year ORDER BY year
    key: [year, tonnes]
    sql_check: |
      SELECT year(d.deal_date) AS year, SUM(d.quantity * d.lot) AS tonnes FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Рис' AND d.unit = 'тонна' GROUP BY 1 ORDER BY 1
  - name: without annulled
    sql: |
      SELECT year, SUM(volume_tonnes) AS tonnes FROM deals WHERE product_canonical = 'Рис' AND NOT is_cancelled
      GROUP BY year ORDER BY year
    key: [year, tonnes]
    sql_check: |
      SELECT year(d.deal_date) AS year, SUM(d.quantity * d.lot) AS tonnes FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Рис' AND d.unit = 'тонна' AND d.status <> 'Аннулирован(Не оплачен)' GROUP BY 1 ORDER BY 1
  questions:
    ru: Динамика продаж риса в тоннах по годам, 2022-2026
    uz_latn: Guruch prodajasi dinamikasi tonnada, 2022-2026 yillar bo‘yicha
    uz_cyrl: Гуруч савдоси динамикаси тоннада, 2022-2026 йиллар бўйича

- id: g015
  split: fresh2
  subject: deals
  shape: breakdown
  answerable: true
  intent: Turnover in UZS of 2025 by delivery basis (EXW, FCA, DAP, CPT), excluding annulled
  readings:
  - name: by delivery basis
    sql: |
      SELECT delivery_basis, SUM(amount_uzs) AS turnover_uzs FROM deals
      WHERE year = 2025 AND NOT is_cancelled GROUP BY delivery_basis ORDER BY turnover_uzs DESC
    key: [delivery_basis, turnover_uzs]
    sql_check: |
      SELECT c.delivery_basis, SUM(CASE d.currency WHEN 'USD' THEN d.amount * d.usd_rate ELSE d.amount END) AS turnover_uzs
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE d.deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31' AND d.status <> 'Аннулирован(Не оплачен)'
      GROUP BY 1 ORDER BY 2 DESC
  questions:
    ru: Как оборот 2025 года (в сумах, без аннулированных) делится по условиям поставки - EXW, FCA, DAP, CPT?
    uz_latn: 2025-yil aylanmasi (so‘mda, bekor qilinganlarsiz) yetkazib berish shartlari - EXW, FCA, DAP, CPT bo‘yicha qanday taqsimlangan?
    uz_cyrl: 2025 йил айланмаси (сўмда, бекор қилинганларсиз) етказиб бериш шартлари - EXW, FCA, DAP, CPT бўйича қандай тақсимланган?

