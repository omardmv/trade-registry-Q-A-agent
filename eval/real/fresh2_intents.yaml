- id: g005
  split: fresh2
  subject: deals
  shape: total
  answerable: true
  intent: 'Tonnes of liquefied gas sold in 2024 (status not specified: all deals, or without annulled)'
  readings:
  - name: all deals
    sql: SELECT SUM(volume_tonnes) AS tonnes FROM deals WHERE year = 2024 AND product_canonical = 'Сжиженный газ'
    key: [tonnes]
    sql_check: |
      SELECT SUM(d.quantity * d.lot) AS tonnes FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Сжиженный газ' AND d.unit = 'тонна'
        AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  - name: without annulled
    sql: SELECT SUM(volume_tonnes) AS tonnes FROM deals WHERE year = 2024 AND product_canonical = 'Сжиженный газ' AND NOT is_cancelled
    key: [tonnes]
    sql_check: |
      SELECT SUM(d.quantity * d.lot) AS tonnes FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Сжиженный газ' AND d.unit = 'тонна' AND d.status <> 'Аннулирован(Не оплачен)'
        AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  questions:
    ru: Скока т сжиженного газа продали за 2024 г.? Мне для отчёта по заправкам
    uz_latn: 2024 yilda necha t suyultirilgan gaz sotildi? Zapravka uchun hisobot kerak edi
    uz_cyrl: 2024 йилда неча тонна суюлтирилган газ сотилди? Ҳисобот учун керак

