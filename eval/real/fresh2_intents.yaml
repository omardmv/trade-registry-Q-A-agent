- id: g003
  split: fresh2
  subject: deals
  shape: count
  answerable: true
  intent: 'Number of rice deals in 2023 (status not specified: all deals, or without annulled)'
  readings:
  - name: all deals
    sql: SELECT COUNT(*) AS deals FROM deals WHERE year = 2023 AND product_canonical = 'Рис'
    key: [deals]
    sql_check: |
      SELECT COUNT(*) AS deals FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Рис' AND d.deal_date BETWEEN DATE '2023-01-01' AND DATE '2023-12-31'
  - name: without annulled
    sql: SELECT COUNT(*) AS deals FROM deals WHERE year = 2023 AND product_canonical = 'Рис' AND NOT is_cancelled
    key: [deals]
    sql_check: |
      SELECT COUNT(*) AS deals FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Рис' AND d.deal_date BETWEEN DATE '2023-01-01' AND DATE '2023-12-31'
        AND d.status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: Сколко сделок по рису было в 2023 г?
    uz_latn: 2023 yilda guruchga nechta sdelka bo‘lgan, bilasizmi?
    uz_cyrl: 2023 йилда гуруч бўйича нечта битим бўлган?

