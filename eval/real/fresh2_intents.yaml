- id: g007
  split: fresh2
  subject: deals
  shape: average
  answerable: true
  intent: Average price per tonne of ammonium nitrate in 2024 excluding annulled, in UZS (weighted by tonnes, or simple mean of deal prices)
  readings:
  - name: weighted per tonne
    sql: |
      SELECT SUM(amount_uzs) / SUM(volume_tonnes) AS price_uzs_per_tonne FROM deals
      WHERE year = 2024 AND product_canonical = 'Аммиачная селитра' AND NOT is_cancelled
    key: [price_uzs_per_tonne]
    sql_check: |
      SELECT SUM(d.amount) / SUM(d.quantity * d.lot) AS price_uzs_per_tonne FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Аммиачная селитра' AND d.unit = 'тонна' AND d.status <> 'Аннулирован(Не оплачен)'
        AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  - name: simple mean per tonne
    sql: |
      SELECT AVG(amount_uzs / volume_tonnes) AS mean_price_uzs_per_tonne FROM deals
      WHERE year = 2024 AND product_canonical = 'Аммиачная селитра' AND NOT is_cancelled
    key: [mean_price_uzs_per_tonne]
    sql_check: |
      SELECT AVG(d.amount / (d.quantity * d.lot)) AS mean_price_uzs_per_tonne FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Аммиачная селитра' AND d.unit = 'тонна' AND d.status <> 'Аннулирован(Не оплачен)'
        AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  questions:
    ru: Почём в среднем шла тонна аммиачной селитры в 2024-м (аннулированные не считаем)? Мне для расчёта подкормки
    uz_latn: 2024-yilda ammiakli selitraning bir tonnasi o‘rtacha qanchadan sotilgan? Bekor bo‘lgan bitimlarsiz
    uz_cyrl: 2024 йилда аммиакли селитранинг бир тоннаси ўртача қанчадан сотилган? Бекор бўлган битимларсиз

- id: g008
  split: fresh2
  subject: deals
  shape: average
  answerable: true
  intent: 'Average size of one wheat deal in tonnes in 2023 (status not specified: all deals, or without annulled)'
  readings:
  - name: all deals
    sql: SELECT AVG(volume_tonnes) AS avg_tonnes FROM deals WHERE year = 2023 AND product_canonical = 'Пшеница'
    key: [avg_tonnes]
    sql_check: |
      SELECT AVG(CASE d.unit WHEN 'тонна' THEN d.quantity * d.lot WHEN 'килограмм' THEN d.quantity * d.lot / 1000.0 END) AS avg_tonnes
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Пшеница' AND d.deal_date BETWEEN DATE '2023-01-01' AND DATE '2023-12-31'
  - name: without annulled
    sql: SELECT AVG(volume_tonnes) AS avg_tonnes FROM deals WHERE year = 2023 AND product_canonical = 'Пшеница' AND NOT is_cancelled
    key: [avg_tonnes]
    sql_check: |
      SELECT AVG(CASE d.unit WHEN 'тонна' THEN d.quantity * d.lot WHEN 'килограмм' THEN d.quantity * d.lot / 1000.0 END) AS avg_tonnes
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Пшеница' AND d.status <> 'Аннулирован(Не оплачен)'
        AND d.deal_date BETWEEN DATE '2023-01-01' AND DATE '2023-12-31'
  questions:
    ru: Какого размера в среднем была одна партия пшеницы (в тоннах) по сделкам 2023 года?
    uz_latn: 2023-yilda bitta bug‘doy bitimida o‘rtacha necha tonna savdo qilingan?
    uz_cyrl: 2023 йилда битта буғдой битимида ўртача неча тонна савдо қилинган?

- id: g009
  split: fresh2
  subject: deals
  shape: share
  answerable: true
  intent: Share (%) of Surxondaryo region (warehouse region) in 2025 rice sales excluding annulled (by tonnes, or by value in UZS)
  readings:
  - name: by tonnes
    sql: |
      SELECT 100.0 * SUM(volume_tonnes) FILTER (WHERE region = 'Surxondaryo viloyati') / SUM(volume_tonnes) AS share_pct
      FROM deals WHERE year = 2025 AND product_canonical = 'Рис' AND NOT is_cancelled
    key: [share_pct]
    sql_check: |
      SELECT 100.0 * SUM(d.quantity * d.lot) FILTER (WHERE c.region = 'Surxondaryo viloyati') / SUM(d.quantity * d.lot) AS share_pct
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Рис' AND d.unit = 'тонна' AND d.status <> 'Аннулирован(Не оплачен)'
        AND d.deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
  - name: by value
    sql: |
      SELECT 100.0 * SUM(amount_uzs) FILTER (WHERE region = 'Surxondaryo viloyati') / SUM(amount_uzs) AS share_pct
      FROM deals WHERE year = 2025 AND product_canonical = 'Рис' AND NOT is_cancelled
    key: [share_pct]
    sql_check: |
      SELECT 100.0 * SUM(d.amount) FILTER (WHERE c.region = 'Surxondaryo viloyati') / SUM(d.amount) AS share_pct
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Рис' AND d.status <> 'Аннулирован(Не оплачен)'
        AND d.deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
  questions:
    ru: Какой процент проданного в 2025 году риса (без аннулированных) пришёлся на Сурхандарьинскую область?
    uz_latn: 2025-yilda sotilgan guruchning necha foizi Surxondaryo viloyatiga to‘g‘ri keladi (bekor qilinganlarsiz)?
    uz_cyrl: 2025 йилда сотилган гуруч неча фоизи Сурхондарё вилоятига тўғри келади (бекор қилинганларсиз)?

- id: g010
  split: fresh2
  subject: deals
  shape: top_n
  answerable: true
  intent: Top 3 warehouse regions by number of liquefied gas deals in 2024, excluding annulled
  readings:
  - name: deal counts by region
    sql: |
      SELECT region, COUNT(*) AS deals FROM deals
      WHERE year = 2024 AND product_canonical = 'Сжиженный газ' AND NOT is_cancelled
      GROUP BY region ORDER BY deals DESC LIMIT 3
    key: [region, deals]
    sql_check: |
      SELECT c.region, COUNT(*) AS deals FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Сжиженный газ' AND d.status <> 'Аннулирован(Не оплачен)'
        AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 3
  questions:
    ru: В каких трёх областях чаще всего заключали сделки по сжиженному газу в 2024 году (без аннулированных)? Нужно число сделок
    uz_latn: 2024-yilda suyultirilgan gaz bo‘yicha eng ko‘p bitim tuzilgan uchta viloyat qaysilar? Bekor bo‘lganlarni hisobga olmang, bitimlar soni ham kerak
    uz_cyrl: 2024 йилда суюлтирилган газ бўйича энг кўп битим тузилган учта вилоят қайсилар? Бекор бўлганларсиз, битимлар сони ҳам керак

- id: g011
  split: fresh2
  subject: deals
  shape: least
  answerable: true
  intent: 'Month of 2023 with the smallest turnover in UZS (status not specified: all deals, or without annulled)'
  readings:
  - name: all deals
    sql: |
      SELECT month, SUM(amount_uzs) AS turnover_uzs FROM deals WHERE year = 2023
      GROUP BY month ORDER BY turnover_uzs ASC LIMIT 1
    key: [month, turnover_uzs]
    sql_check: |
      SELECT month(deal_date) AS month, SUM(CASE currency WHEN 'USD' THEN amount * usd_rate ELSE amount END) AS turnover_uzs
      FROM deals WHERE deal_date BETWEEN DATE '2023-01-01' AND DATE '2023-12-31' GROUP BY 1 ORDER BY 2 ASC LIMIT 1
  - name: without annulled
    sql: |
      SELECT month, SUM(amount_uzs) AS turnover_uzs FROM deals WHERE year = 2023 AND NOT is_cancelled
      GROUP BY month ORDER BY turnover_uzs ASC LIMIT 1
    key: [month, turnover_uzs]
    sql_check: |
      SELECT month(deal_date) AS month, SUM(CASE currency WHEN 'USD' THEN amount * usd_rate ELSE amount END) AS turnover_uzs
      FROM deals WHERE deal_date BETWEEN DATE '2023-01-01' AND DATE '2023-12-31' AND status <> 'Аннулирован(Не оплачен)'
      GROUP BY 1 ORDER BY 2 ASC LIMIT 1
  questions:
    ru: В каком месяце 2023 года оборот биржи в сумах был самым маленьким?
    uz_latn: 2023-yilning qaysi oyida birja aylanmasi (so‘mda) eng kam bo‘lgan?
    uz_cyrl: 2023 йилнинг қайси ойида биржа айланмаси (сўмда) энг кам бўлган?

- id: g012
  split: fresh2
  subject: deals
  shape: distinct_count
  answerable: true
  intent: 'Number of distinct seller companies that had deals in 2023 (status not specified: all deals, or without annulled)'
