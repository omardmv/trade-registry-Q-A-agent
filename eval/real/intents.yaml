- id: r034
  split: dev
  subject: deals
  shape: compare_periods
  answerable: true
  intent: "Deal counts in Q1 2025 versus Q1 2026 and the change in % (all deals, or without annulled)"
  readings:
    - name: all deals
      sql: |-
        SELECT COUNT(*) FILTER (WHERE year = 2025) AS q1_2025, COUNT(*) FILTER (WHERE year = 2026) AS q1_2026,
               100.0 * (COUNT(*) FILTER (WHERE year = 2026)) / (COUNT(*) FILTER (WHERE year = 2025)) - 100 AS change_pct
        FROM deals WHERE quarter = 1 AND year IN (2025, 2026)
      key: [q1_2025, q1_2026]
    - name: without annulled
      sql: |-
        SELECT COUNT(*) FILTER (WHERE year = 2025) AS q1_2025, COUNT(*) FILTER (WHERE year = 2026) AS q1_2026,
               100.0 * (COUNT(*) FILTER (WHERE year = 2026)) / (COUNT(*) FILTER (WHERE year = 2025)) - 100 AS change_pct
        FROM deals WHERE quarter = 1 AND year IN (2025, 2026) AND NOT is_cancelled
      key: [q1_2025, q1_2026]

