# Realistic evaluation intents (see docs/eval-design.md).
# Each intent: what is asked, with reference SQL per acceptable reading. `sql_check` (an independent second
# query) and `questions` (ru / uz_latn / uz_cyrl phrasings) are written separately.
# Conventions: money in amount_uzs (amount_usd when dollars are asked); annulled = is_cancelled; rankings,
# averages and money exclude annulled deals unless the intent says otherwise; canonical products
# (product_canonical) unless a specific spelling / grade is named; mass in volume_tonnes.

# ---------------------------------------------------------------- deals
- id: r001
  split: dev
  subject: deals
  shape: lookup
  answerable: true
  intent: "Buyer, seller, product, amount in UZS and status of deal No. 387830"
  readings:
    - name: deal card
      sql: |-
        SELECT d.deal_id, d.deal_date, d.product_canonical, d.buyer_inn, pb.name AS buyer_name,
               d.seller_inn, ps.name AS seller_name, d.amount_uzs, d.status
        FROM deals d
        LEFT JOIN participants pb ON pb.inn = d.buyer_inn
        LEFT JOIN participants ps ON ps.inn = d.seller_inn
        WHERE d.deal_id = 387830
      key: [buyer_inn, seller_inn, amount_uzs, status]

