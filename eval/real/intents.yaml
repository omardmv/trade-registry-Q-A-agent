- id: r037
  split: test
  subject: deals
  shape: compare_periods
  answerable: true
  intent: "Share (%) of annulled deals by count in 2024 versus 2025 and the change in percentage points"
  readings:
    - name: pct and pp
      sql: |-
        SELECT 100.0 * COUNT(*) FILTER (WHERE year = 2024 AND is_cancelled) / COUNT(*) FILTER (WHERE year = 2024) AS pct_2024,
               100.0 * COUNT(*) FILTER (WHERE year = 2025 AND is_cancelled) / COUNT(*) FILTER (WHERE year = 2025) AS pct_2025,
               100.0 * COUNT(*) FILTER (WHERE year = 2025 AND is_cancelled) / COUNT(*) FILTER (WHERE year = 2025)
               - 100.0 * COUNT(*) FILTER (WHERE year = 2024 AND is_cancelled) / COUNT(*) FILTER (WHERE year = 2024) AS change_pp
        FROM deals WHERE year IN (2024, 2025)
      key: [pct_2024, pct_2025]

