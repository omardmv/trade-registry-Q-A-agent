- id: r001
  split: dev
  subject: deals
  shape: lookup
  answerable: true
  intent: Buyer, seller, product, amount in UZS and status of deal No. 387830
  readings:
  - name: deal card
    sql: "SELECT d.deal_id, d.deal_date, d.product_canonical, d.buyer_inn, pb.name AS buyer_name,\n       d.seller_inn, ps.name AS seller_name, d.amount_uzs, d.status\nFROM deals d\nLEFT JOIN participants\
