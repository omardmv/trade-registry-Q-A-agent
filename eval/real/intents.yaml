- id: r014
  split: test
  subject: deals
  shape: average
  answerable: true
  intent: "Average price of raw cotton in 2025 excluding annulled (weighted per kg, or simple mean of deal prices per tonne)"
  readings:
    - name: weighted per kg
      sql: |-
        SELECT SUM(amount_uzs) / (SUM(volume_tonnes) * 1000) AS price_uzs_per_kg FROM deals
        WHERE product_canonical = 'Хлопок-сырец' AND year = 2025 AND NOT is_cancelled
      key: [price_uzs_per_kg]
    - name: simple mean per tonne
      sql: |-
        SELECT AVG(amount_uzs / volume_tonnes) AS mean_price_uzs_per_t FROM deals
        WHERE product_canonical = 'Хлопок-сырец' AND year = 2025 AND NOT is_cancelled
      key: [mean_price_uzs_per_t]

