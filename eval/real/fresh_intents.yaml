- id: f013
  split: fresh
  subject: deals
  shape: compare_periods
  answerable: true
  intent: Tonnes of sunflower oil sold in January–June 2025 versus January–June 2026, excluding annulled, and the change in %
  readings:
  - name: tonnes h1
    sql: |
      SELECT SUM(volume_tonnes) FILTER (WHERE year = 2025) AS h1_2025, SUM(volume_tonnes) FILTER (WHERE year = 2026) AS h1_2026,
             100.0 * SUM(volume_tonnes) FILTER (WHERE year = 2026) / SUM(volume_tonnes) FILTER (WHERE year = 2025) - 100 AS change_pct
      FROM deals WHERE product_canonical = 'Масло подсолнечное' AND year IN (2025, 2026) AND month <= 6 AND NOT is_cancelled
    key: [h1_2025, h1_2026]
    sql_check: |
      SELECT SUM(CASE WHEN d.deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-06-30' THEN d.quantity * d.lot END) AS h1_2025,
             SUM(CASE WHEN d.deal_date BETWEEN DATE '2026-01-01' AND DATE '2026-06-30' THEN d.quantity * d.lot END) AS h1_2026
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Масло подсолнечное' AND d.status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: 'Сравни продажи подсолнечного масла в тоннах: январь–июнь 2025 против января–июня 2026, на сколько процентов изменилось? без аннулированных'
    uz_latn: 'Kungaboqar yog‘i sotuvi (tonnada): 2025 yanvar–iyun va 2026 yanvar–iyun, necha foizga o‘zgargan? Bekor qilinganlarsiz'
    uz_cyrl: Кунгабоқар ёғи 2025 йилнинг биринчи ярмида ва 2026 йилнинг биринчи ярмида неча тонна сотилган, фарқи неча фоиз? бекор қилинганларсиз

- id: f014
  split: fresh
  subject: deals
  shape: trend
  answerable: true
  intent: Average price of wheat flour per kg in each year 2022–2026, excluding annulled (weighted by kg, or simple mean of deal prices)
  readings:
  - name: weighted per kg
    sql: |
      SELECT year, SUM(amount_uzs) / SUM(volume) AS price_uzs_per_kg FROM deals
      WHERE product_canonical = 'Мука пшеничная' AND NOT is_cancelled GROUP BY year ORDER BY year
    key: [year, price_uzs_per_kg]
    sql_check: |
      SELECT year(d.deal_date) AS year, SUM(d.amount) / SUM(d.quantity * d.lot) AS price_uzs_per_kg
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Мука пшеничная' AND d.unit = 'килограмм' AND d.status <> 'Аннулирован(Не оплачен)'
      GROUP BY 1 ORDER BY 1
  - name: simple mean per kg
    sql: |
      SELECT year, AVG(amount_uzs / volume) AS mean_price_uzs_per_kg FROM deals
      WHERE product_canonical = 'Мука пшеничная' AND NOT is_cancelled GROUP BY year ORDER BY year
    key: [year, mean_price_uzs_per_kg]
    sql_check: |
      SELECT year(d.deal_date) AS year, AVG(d.amount / (d.quantity * d.lot)) AS mean_price_uzs_per_kg
      FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Мука пшеничная' AND d.status <> 'Аннулирован(Не оплачен)'
      GROUP BY 1 ORDER BY 1
  questions:
    ru: Как менялась средняя цена пшеничной муки за килограмм по годам с 2022 по 2026? Аннулированные сделки не брать
    uz_latn: Bug‘doy unining bir kilogrammi o‘rtacha narxi 2022–2026 yillar bo‘yicha qanday o‘zgargan? bekor bo‘lganlarsiz
    uz_cyrl: Буғдой уни килограммининг ўртача нархи йилма-йил қандай ўзгарди, 2022 дан 2026 гача? бекор қилинганларсиз

- id: f015
  split: fresh
  subject: deals
  shape: breakdown
  answerable: true
  intent: 2025 turnover in UZS split into domestic and export deals, excluding annulled
  readings:
  - name: by contract type
    sql: |
      SELECT contract_type, SUM(amount_uzs) AS turnover_uzs FROM deals
      WHERE year = 2025 AND NOT is_cancelled GROUP BY contract_type ORDER BY turnover_uzs DESC
    key: [contract_type, turnover_uzs]
    sql_check: |
      SELECT c.contract_type, SUM(CASE WHEN d.currency = 'USD' THEN d.amount * r.rate ELSE d.amount END) AS turnover_uzs
      FROM deals d JOIN contracts c USING (contract_id) LEFT JOIN usd_rates r ON r.rate_date = d.deal_date
      WHERE year(d.deal_date) = 2025 AND d.status <> 'Аннулирован(Не оплачен)'
      GROUP BY 1 ORDER BY 2 DESC
  questions:
    ru: Раздели оборот 2025 года на внутренние и экспортные сделки — сколько в сумах каждое? без аннулированных
    uz_latn: 2025 yilgi aylanmani ichki va eksport bitimlariga bo‘lib ko‘rsating, so‘mda, bekor qilinganlarsiz
    uz_cyrl: 2025 йил айланмаси ички ва экспорт битимлари бўйича неча сўмдан? бекор қилинганлар ҳисобга олинмасин

- id: f016
  split: fresh
  subject: deals
  shape: date_of_extreme
  answerable: true
  intent: 'Day of 2026 with the largest turnover in UZS (status not specified: all deals, or without annulled)'
  readings:
  - name: without annulled
    sql: |
      SELECT deal_date, SUM(amount_uzs) AS turnover_uzs FROM deals
      WHERE year = 2026 AND NOT is_cancelled GROUP BY deal_date ORDER BY turnover_uzs DESC LIMIT 1
    key: [deal_date]
    sql_check: |
      SELECT d.deal_date, SUM(CASE WHEN d.currency = 'USD' THEN d.amount * r.rate ELSE d.amount END) AS turnover_uzs
