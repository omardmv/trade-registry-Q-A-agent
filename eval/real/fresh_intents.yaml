# ---------------------------------------------------------------- deals
- id: f001
  split: fresh
  subject: deals
  shape: lookup
  answerable: true
  intent: Seller, buyer and amount in UZS of deal No. 455120
  readings:
  - name: deal card
    sql: |
      SELECT d.deal_id, d.seller_inn, ps.name AS seller_name, d.buyer_inn, pb.name AS buyer_name, d.amount_uzs, d.status
      FROM deals d
      LEFT JOIN participants ps ON ps.inn = d.seller_inn
      LEFT JOIN participants pb ON pb.inn = d.buyer_inn
      WHERE d.deal_id = 455120
    key: [seller_inn, buyer_inn, amount_uzs]
    sql_check: SELECT seller_inn, buyer_inn, amount AS amount_uzs FROM deals WHERE deal_id = 455120 AND currency = 'UZS'
  questions:
    ru: 'Сделка 455120: кто продал, кто купил и на какую сумму?'
    uz_latn: 455120-sonli bitimda sotuvchi kim, xaridor kim va summasi qancha bo‘lgan?
    uz_cyrl: 455120 битим бўйича сотувчи ва харидор ким, сумма қанча?

- id: f002
  split: fresh
  subject: deals
  shape: lookup
  answerable: true
  intent: Seller's broker and buyer's broker of deal No. 523417
  readings:
  - name: both brokers
    sql: |
      SELECT d.deal_id, d.seller_broker, bs.name AS seller_broker_name, d.buyer_broker, bb.name AS buyer_broker_name
      FROM deals d
      LEFT JOIN brokers bs ON bs.broker_code = d.seller_broker
      LEFT JOIN brokers bb ON bb.broker_code = d.buyer_broker
      WHERE d.deal_id = 523417
    key: [seller_broker, buyer_broker]
    sql_check: SELECT seller_broker, buyer_broker FROM deals WHERE deal_id = 523417
  questions:
    ru: какие брокеры были у продавца и у покупателя в сделке номер 523417
    uz_latn: 523417 raqamli bitimda sotuvchi va xaridor tomonidan qaysi brokerlar qatnashgan?
    uz_cyrl: 523417-битимда сотувчининг брокери ким эди, харидорники-чи?

- id: f003
  split: fresh
  subject: deals
  shape: count
  answerable: true
  intent: 'Number of polyethylene deals in 2024 (status not specified: all deals, or without annulled)'
  readings:
  - name: all deals
    sql: SELECT COUNT(*) AS deals FROM deals WHERE year = 2024 AND product_canonical = 'Полиэтилен'
    key: [deals]
    sql_check: |
      SELECT COUNT(*) AS deals FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Полиэтилен' AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  - name: without annulled
    sql: SELECT COUNT(*) AS deals FROM deals WHERE year = 2024 AND product_canonical = 'Полиэтилен' AND NOT is_cancelled
    key: [deals]
    sql_check: |
      SELECT COUNT(*) AS deals FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Полиэтилен' AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
        AND d.status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: Сколько сделок с полиэтиленом прошло на бирже в 2024 году?
    uz_latn: 2024-yilda polietilen bo‘yicha nechta bitim tuzilgan?
    uz_cyrl: 2024 йилда полиэтилен бўйича нечта битим бўлди?

- id: f004
  split: fresh
  subject: deals
  shape: count
  answerable: true
  intent: Number of 2025 deals executed only partially (paid, part of the lots delivered)
  readings:
  - name: partially executed
    sql: SELECT COUNT(*) AS partial FROM deals WHERE year = 2025 AND status = 'Исполнен(Частично)'
    key: [partial]
    sql_check: |
      SELECT COUNT(*) AS partial FROM deals
      WHERE deal_date >= DATE '2025-01-01' AND deal_date < DATE '2026-01-01' AND delivered_lots > 0 AND delivered_lots < quantity
  questions:
    ru: Сколько сделок в 2025 году исполнены только частично — товар поставлен не полностью?
    uz_latn: 2025 yilda nechta bitim qisman bajarilgan, ya’ni tovar to‘liq yetkazilmagan?
    uz_cyrl: 2025 йилда товари тўлиқ етказилмаган, қисман бажарилган битимлар сони қанча?

- id: f005
  split: fresh
  subject: deals
  shape: total
  answerable: true
  intent: Tonnes of carbamide (urea) sold in 2023, excluding annulled deals
  readings:
  - name: tonnes
    sql: SELECT SUM(volume_tonnes) AS tonnes FROM deals WHERE year = 2023 AND product_canonical = 'Карбамид' AND NOT is_cancelled
    key: [tonnes]
    sql_check: |
      SELECT SUM(d.quantity * d.lot) AS tonnes FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Карбамид' AND d.unit = 'тонна' AND year(d.deal_date) = 2023
        AND d.status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: Сколько тонн карбамида продали в 2023 году? аннулированные не считать
    uz_latn: 2023-yilda necha tonna karbamid sotilgan (bekor qilingan bitimlarsiz)?
    uz_cyrl: 2023 йил давомида неча тонна карбамид сотилди? Бекор бўлганларини ҳисобламанг

