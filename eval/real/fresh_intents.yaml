- id: f007
  split: fresh
  subject: deals
  shape: average
  answerable: true
  intent: Average price per tonne of steel rebar in 2025 excluding annulled (weighted by tonnes, or simple mean of deal prices)
  readings:
  - name: weighted per tonne
    sql: |
      SELECT SUM(amount_uzs) / SUM(volume_tonnes) AS price_uzs_per_t FROM deals
      WHERE year = 2025 AND product_canonical = 'Арматура стальная' AND NOT is_cancelled
    key: [price_uzs_per_t]
    sql_check: |
      SELECT SUM(d.amount) / SUM(d.quantity * d.lot) AS price_uzs_per_t FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Арматура стальная' AND year(d.deal_date) = 2025 AND d.status <> 'Аннулирован(Не оплачен)'
  - name: simple mean per tonne
    sql: |
      SELECT AVG(amount_uzs / volume_tonnes) AS mean_price_uzs_per_t FROM deals
      WHERE year = 2025 AND product_canonical = 'Арматура стальная' AND NOT is_cancelled
    key: [mean_price_uzs_per_t]
    sql_check: |
      SELECT AVG(d.amount / (d.quantity * d.lot)) AS mean_price_uzs_per_t FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Арматура стальная' AND year(d.deal_date) = 2025 AND d.status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: сколько в среднем стоила тонна арматуры в 2025м? без аннулированых
    uz_latn: 2025 yilda armaturaning bir tonnasi o‘rtacha necha so‘mdan sotilgan? bekor qilinganlarsiz
    uz_cyrl: 2025 йилда арматура тоннаси ўртача неча пул турди? бекор қилинган битимлар ҳисобга олинмасин

- id: f008
  split: fresh
  subject: contracts
  shape: least
  answerable: true
  intent: Industry with the fewest registered contracts (whole registry), and how many
  readings:
  - name: by industry
    sql: SELECT industry, COUNT(*) AS contracts FROM contracts GROUP BY industry ORDER BY contracts LIMIT 1
    key: [industry, contracts]
    sql_check: |
      SELECT industry, contracts FROM (SELECT industry, COUNT(*) AS contracts, rank() OVER (ORDER BY COUNT(*)) AS rk
        FROM contracts GROUP BY 1) WHERE rk = 1
  questions:
