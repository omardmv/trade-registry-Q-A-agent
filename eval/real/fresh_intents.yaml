    sql: SELECT SUM(amount_uzs) AS total_uzs FROM deals WHERE year = 2025 AND seller_broker = 'BK101' AND NOT is_cancelled
    key: [total_uzs]
    sql_check: |
      SELECT SUM(CASE WHEN d.currency = 'USD' THEN d.amount * r.rate ELSE d.amount END) AS total_uzs
      FROM deals d JOIN brokers b ON b.broker_code = d.seller_broker LEFT JOIN usd_rates r ON r.rate_date = d.deal_date
      WHERE b.name_norm = 'rofo broker' AND year(d.deal_date) = 2025 AND d.status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: Общая сумма сделок 2025 года, где ROFO BROKER представлял продавца (без аннулированных)
