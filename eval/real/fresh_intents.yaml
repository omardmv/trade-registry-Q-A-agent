      WHERE d.deal_date >= DATE '2026-01-01' AND d.status <> 'Аннулирован(Не оплачен)'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 1
  - name: all deals
    sql: |
      SELECT deal_date, SUM(amount_uzs) AS turnover_uzs FROM deals
      WHERE year = 2026 GROUP BY deal_date ORDER BY turnover_uzs DESC LIMIT 1
    key: [deal_date]
    sql_check: |
      SELECT d.deal_date, SUM(CASE WHEN d.currency = 'USD' THEN d.amount * r.rate ELSE d.amount END) AS turnover_uzs
      FROM deals d LEFT JOIN usd_rates r ON r.rate_date = d.deal_date
      WHERE d.deal_date >= DATE '2026-01-01' GROUP BY 1 ORDER BY 2 DESC LIMIT 1
  questions:
    ru: В какой день 2026 года на бирже был самый большой оборот в сумах?
    uz_latn: 2026 yilda qaysi kuni birjada eng katta savdo aylanmasi bo‘lgan (so‘mda)?
    uz_cyrl: 2026 йилнинг қайси кунида биржада энг катта пуллик савдо бўлган?

