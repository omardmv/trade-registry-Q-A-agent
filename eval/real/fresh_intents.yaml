    uz_cyrl: Биржада энг кам шартнома қайси саноат тармоғига тўғри келади?

- id: f009
  split: fresh
  subject: deals
  shape: share
  answerable: true
  intent: Share (%) of Fergana region (warehouse region; equals the seller company's region here) in 2024 turnover in UZS, excluding annulled
  readings:
  - name: warehouse region
    sql: |
      SELECT 100.0 * SUM(amount_uzs) FILTER (WHERE region = 'Farg‘ona viloyati') / SUM(amount_uzs) AS fergana_pct
      FROM deals WHERE year = 2024 AND NOT is_cancelled
    key: [fergana_pct]
    sql_check: |
      SELECT 100.0 * SUM(CASE WHEN c.region_ru = 'Ферганская область' THEN d.amount_uzs ELSE 0 END) / SUM(d.amount_uzs) AS fergana_pct
      FROM deals d JOIN contracts c USING (contract_id) WHERE year(d.deal_date) = 2024 AND d.status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: Какую долю оборота 2024 года дала Ферганская область? Без аннулированных, в сумах
    uz_latn: 2024-yilgi savdo aylanmasida Farg‘ona viloyatining ulushi qancha foiz? Bekor qilinganlarsiz
    uz_cyrl: 2024 йил айланмасида Фарғона вилоятининг улуши неча фоиз бўлган? бекор қилинганларсиз

