- id: f043
  split: fresh
  subject: usd_rates
  shape: compare_periods
  answerable: true
  intent: Average USD rate in Q1 2024 versus Q1 2025 and the change in %
  readings:
  - name: quarter means
    sql: |
      SELECT AVG(rate) FILTER (WHERE year(rate_date) = 2024) AS q1_2024, AVG(rate) FILTER (WHERE year(rate_date) = 2025) AS q1_2025,
             100.0 * AVG(rate) FILTER (WHERE year(rate_date) = 2025) / AVG(rate) FILTER (WHERE year(rate_date) = 2024) - 100 AS change_pct
      FROM usd_rates WHERE quarter(rate_date) = 1 AND year(rate_date) IN (2024, 2025)
    key: [q1_2024, q1_2025]
    sql_check: |
      SELECT (SELECT AVG(rate) FROM usd_rates WHERE rate_date BETWEEN DATE '2024-01-01' AND DATE '2024-03-31') AS q1_2024,
             (SELECT AVG(rate) FROM usd_rates WHERE rate_date BETWEEN DATE '2025-01-01' AND DATE '2025-03-31') AS q1_2025
  questions:
    ru: Сравни средний курс доллара в первом квартале 2024 и первом квартале 2025 — на сколько % вырос?
    uz_latn: 2024 va 2025 yillarning birinchi choragida dollarning o‘rtacha kursi qancha bo‘lgan, farqi necha foiz?
    uz_cyrl: Долларнинг ўртача курси 2024 йил I чоракда ва 2025 йил I чоракда қанча эди, неча фоизга ўзгарган?

- id: f044
  split: fresh
  subject: usd_rates
  shape: date_of_extreme
  answerable: true
  intent: Day of 2026 with the lowest UZS per USD rate, and that rate
  readings:
  - name: cheapest dollar
    sql: SELECT rate_date, rate FROM usd_rates WHERE year(rate_date) = 2026 ORDER BY rate, rate_date LIMIT 1
    key: [rate_date, rate]
    sql_check: |
      SELECT rate_date, rate FROM usd_rates
      WHERE rate = (SELECT MIN(rate) FROM usd_rates WHERE rate_date >= DATE '2026-01-01') AND rate_date >= DATE '2026-01-01'
  questions:
