- id: f018
  split: fresh
  subject: contracts
  shape: lookup
  answerable: true
  intent: Base price, payment term and delivery term of contract No. 104321
  readings:
  - name: contract terms
    sql: |
      SELECT contract_id, product_name, base_price, currency, unit, payment_term_days, delivery_term_days, packaging
      FROM contracts WHERE contract_id = 104321
    key: [base_price, payment_term_days, delivery_term_days]
    sql_check: |
      SELECT DISTINCT c.base_price, d.payment_term_days, d.delivery_term_days
