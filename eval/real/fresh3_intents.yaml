# Fresh evaluation set 3: written from the data (data/README.md, data_dictionary, the DuckDB tables) only,
# independently of the system; asks what different real users would type (regional official, accountant, grain trader,
# logistics manager, reporter, elderly farmer, student). Same format as intents.yaml; split "fresh3" for all.
# Check: uv run python -m eval.real.check_intents --file eval/real/fresh3_intents.yaml
# Run:   uv run python -m eval.real.run --intents eval/real/fresh3_intents.yaml --split fresh3

- id: h001
  split: fresh3
  subject: deals
  shape: lookup
  answerable: true
  intent: Status and delivery date of deal No. 468800
  readings:
  - name: status and delivery date
    sql: SELECT status, delivery_date FROM deals WHERE deal_id = 468800
    key:
    - status
    - delivery_date
    sql_check: SELECT status, delivery_date FROM deals WHERE deal_id = 468800 AND delivery_date IS NOT NULL
  questions:
    ru: Скажите пожалуйста, по сделке номер 468800 товар уже привезли? Какой там статус и в какой день доставили?
    uz_latn: 468800-raqamli bitim bo‘yicha mol yetkazib berildimi? Holati qanday va qaysi kuni olib kelingan?
    uz_cyrl: 468800 рақамли битим бўйича мол етказиб берилдими? Ҳолати қандай ва қайси куни олиб келинган?

- id: h002
  split: fresh3
  subject: deals
  shape: lookup
  answerable: true
  intent: Names of the seller's broker and the buyer's broker of deal No. 237654
  readings:
  - name: broker names
    sql: |
      SELECT bs.name AS seller_broker_name, bb.name AS buyer_broker_name
      FROM deals d JOIN brokers bs ON bs.broker_code = d.seller_broker JOIN brokers bb ON bb.broker_code = d.buyer_broker
      WHERE d.deal_id = 237654
    key:
    - seller_broker_name
    - buyer_broker_name
    sql_check: |
      SELECT (SELECT name FROM brokers WHERE broker_code = (SELECT seller_broker FROM deals WHERE deal_id = 237654)) AS seller_broker_name,
             (SELECT name FROM brokers WHERE broker_code = (SELECT buyer_broker FROM deals WHERE deal_id = 237654)) AS buyer_broker_name
  questions:
    ru: Через какие брокерские конторы шла сделка №237654 — у продавца и у покупателя? Названия нужны
    uz_latn: 237654-sonli bitimni qaysi brokerlik idoralari olib borgan — sotuvchi tomondan ham, xaridor tomondan ham? Nomlari kerak
    uz_cyrl: 237654-сонли битимни қайси брокерлик идоралари олиб борган — сотувчи томондан ҳам, харидор томондан ҳам? Номлари керак

- id: h003
  split: fresh3
  subject: deals
  shape: count
  answerable: true
  intent: 'Number of rice deals from January to March 2026 (status not specified: all deals, or without annulled)'
  readings:
  - name: all deals
    sql: SELECT COUNT(*) AS n FROM deals WHERE product_canonical = 'Рис' AND deal_date BETWEEN DATE '2026-01-01' AND DATE '2026-03-31'
    key:
    - n
    sql_check: SELECT COUNT(*) AS n FROM deals d JOIN contracts c USING (contract_id) WHERE c.product_canonical = 'Рис' AND d.deal_date >= DATE '2026-01-01' AND d.deal_date < DATE '2026-04-01'
  - name: without annulled
    sql: SELECT COUNT(*) AS n FROM deals WHERE product_canonical = 'Рис' AND NOT is_cancelled AND deal_date BETWEEN DATE '2026-01-01' AND DATE '2026-03-31'
    key:
    - n
    sql_check: SELECT COUNT(*) AS n FROM deals d JOIN contracts c USING (contract_id) WHERE c.product_canonical = 'Рис' AND d.status <> 'Аннулирован(Не оплачен)' AND d.deal_date >= DATE '2026-01-01' AND d.deal_date < DATE '2026-04-01'
  questions:
    ru: Сколько сделок по рису прошло в первом квартале 2026 года? Пишу заметку в районную газету
    uz_latn: 2026-yil birinchi choragida guruch bo‘yicha nechta bitim bo‘lgan? Tuman gazetasiga maqola yozyapman
    uz_cyrl: 2026 йил биринчи чорагида гуруч бўйича нечта битим бўлган? Туман газетасига мақола ёзяпман

- id: h004
  split: fresh3
  subject: deals
  shape: total
  answerable: true
  intent: Tonnes of sugar sold in 2025 without annulled deals
  readings:
  - name: without annulled
    sql: SELECT SUM(volume_tonnes) AS tonnes FROM deals WHERE year = 2025 AND product_canonical = 'Сахар' AND NOT is_cancelled
    key:
    - tonnes
    sql_check: SELECT SUM(d.quantity * d.lot) AS tonnes FROM deals d JOIN contracts c USING (contract_id) WHERE c.product_canonical = 'Сахар' AND d.unit = 'тонна' AND d.status <> 'Аннулирован(Не оплачен)' AND d.deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
  questions:
    ru: Сколько всего тонн сахара реально ушло в 2025 году, аннулированные сделки не считать
    uz_latn: 2025-yilda jami necha tonna shakar chindan ham sotilgan, bekor qilingan bitimlarni hisobga olmang
    uz_cyrl: 2025 йилда жами неча тонна шакар чиндан ҳам сотилган, бекор қилинган битимларни ҳисобга олманг

- id: h005
  split: fresh3
  subject: deals
  shape: average
  answerable: true
  intent: Average price per tonne of wheat in Khorezm region in 2024 in soums (average of deal prices, or weighted by volume)
  readings:
  - name: mean of deal prices
    sql: SELECT AVG(unit_price) AS price FROM deals WHERE year = 2024 AND product_canonical = 'Пшеница' AND region = 'Xorazm viloyati' AND currency = 'UZS'
    key:
    - price
    sql_check: SELECT AVG(d.amount / (d.quantity * d.lot)) AS price FROM deals d JOIN contracts c USING (contract_id) WHERE c.product_canonical = 'Пшеница' AND d.region = 'Xorazm viloyati' AND c.currency = 'UZS' AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  - name: weighted by volume
    sql: SELECT SUM(amount) / SUM(volume) AS price FROM deals WHERE year = 2024 AND product_canonical = 'Пшеница' AND region = 'Xorazm viloyati' AND currency = 'UZS'
    key:
    - price
    sql_check: SELECT SUM(d.amount) / SUM(d.quantity * d.lot) AS price FROM deals d JOIN contracts c USING (contract_id) WHERE c.product_canonical = 'Пшеница' AND d.region = 'Xorazm viloyati' AND c.currency = 'UZS' AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  questions:
    ru: Почём в среднем шла тонна пшеницы с хорезмских складов в 2024-м? В сумах
    uz_latn: Xorazm omborlaridan 2024-yilda bir tonna bug‘doy o‘rtacha qanchadan ketgan? So‘mda ayting
    uz_cyrl: Хоразм омборларидан 2024 йилда бир тонна буғдой ўртача қанчадан кетган? Сўмда айтинг

- id: h006
  split: fresh3
  subject: deals
  shape: share
  answerable: true
  intent: Share of annulled (unpaid) deals among all 2025 deals, in percent
  readings:
  - name: annulled share of all deals
    sql: SELECT 100.0 * AVG(CASE WHEN is_cancelled THEN 1 ELSE 0 END) AS share_pct FROM deals WHERE year = 2025
    key:
    - share_pct
    sql_check: SELECT 100.0 * COUNT(*) FILTER (WHERE status = 'Аннулирован(Не оплачен)') / COUNT(*) AS share_pct FROM deals WHERE deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
  questions:
    ru: какой процент сделок 2025 года накрылся из-за неоплаты?
    uz_latn: 2025-yilda tuzilgan bitimlarning necha foizi to‘lanmagani uchun bekor bo‘lgan?
    uz_cyrl: 2025 йилда тузилган битимларнинг неча фоизи тўланмагани учун бекор бўлган?

- id: h007
  split: fresh3
  subject: deals
  shape: top_n
  answerable: true
  intent: Top 3 regions by tonnes of wheat sold in 2024, annulled deals not counted
  readings:
  - name: top 3 regions
    sql: |
      SELECT region, SUM(volume_tonnes) AS tonnes FROM deals
      WHERE year = 2024 AND product_canonical = 'Пшеница' AND NOT is_cancelled
      GROUP BY region ORDER BY tonnes DESC LIMIT 3
    key:
    - region
    sql_check: |
      SELECT d.region, SUM(d.quantity * d.lot) AS tonnes FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Пшеница' AND d.unit = 'тонна' AND d.status <> 'Аннулирован(Не оплачен)'
        AND d.deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
      GROUP BY d.region ORDER BY tonnes DESC LIMIT 3
  questions:
    ru: Назовите три области-лидера по продаже пшеницы в 2024 году (в тоннах, без аннулированных)
    uz_latn: 2024-yilda bug‘doy sotish bo‘yicha yetakchi uchta viloyatni ayting (tonnada, bekor qilinganlarsiz)
    uz_cyrl: 2024 йилда буғдой сотиш бўйича етакчи учта вилоятни айтинг (тоннада, бекор қилинганларсиз)

