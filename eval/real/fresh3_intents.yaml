- id: h021
  split: fresh3
  subject: contracts
  shape: compare_periods
  answerable: true
  intent: Number of cotton oil contracts registered in 2023 versus 2025
  readings:
  - name: 2023 vs 2025
    sql: |
      SELECT year(registered_date) AS year, COUNT(*) AS n FROM contracts
      WHERE product_canonical = 'Масло хлопковое' AND year(registered_date) IN (2023, 2025)
      GROUP BY 1 ORDER BY 1
    key:
    - year
    - n
    sql_check: |
      SELECT EXTRACT(year FROM registered_date)::INT AS year, COUNT(*) AS n FROM contracts
      WHERE product_canonical = 'Масло хлопковое' AND (registered_date BETWEEN DATE '2023-01-01' AND DATE '2023-12-31' OR registered_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31')
      GROUP BY 1 ORDER BY 1
  questions:
    ru: 'Хлопковое масло: контрактов в 2025 году завели больше, чем в 2023-м, или нет? Сколько там и там'
    uz_latn: 'Paxta moyi: 2025-yilda 2023-yildagidan ko‘proq shartnoma kiritilganmi yoki yo‘qmi? Ikkalasida nechtadan'
    uz_cyrl: 'Пахта мойи: 2025 йилда 2023 йилдагидан кўпроқ шартнома киритилганми ёки йўқми? Иккаласида нечтадан'

