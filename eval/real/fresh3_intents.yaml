- id: h009
  split: fresh3
  subject: deals
  shape: compare_periods
  answerable: true
  intent: Number of bitumen deals in the first half of 2025 versus the first half of 2026 (all deals)
  readings:
  - name: H1 2025 vs H1 2026
    sql: |
      SELECT year, COUNT(*) AS n FROM deals
      WHERE product_canonical = 'Битум нефтяной' AND year IN (2025, 2026) AND month <= 6
      GROUP BY year ORDER BY year
    key:
    - year
    - n
    sql_check: |
      SELECT year(d.deal_date) AS year, COUNT(*) AS n FROM deals d JOIN contracts c USING (contract_id)
      WHERE c.product_canonical = 'Битум нефтяной' AND d.deal_date IN (SELECT UNNEST(generate_series(DATE '2025-01-01', DATE '2025-06-30', INTERVAL 1 DAY))::DATE UNION ALL SELECT UNNEST(generate_series(DATE '2026-01-01', DATE '2026-06-30', INTERVAL 1 DAY))::DATE)
      GROUP BY 1 ORDER BY 1
  questions:
    ru: 'Битум: сделок за январь-июнь 2026 больше или меньше, чем за те же полгода 2025? Дайте цифры по обоим'
    uz_latn: 'Bitum: 2026-yil yanvar-iyun oylarida bitimlar 2025-yilning shu yarim yilidan ko‘pmi yoki kammi? Ikkalasining raqamini bering'
    uz_cyrl: 'Битум: 2026 йил январь-июнь ойларида битимлар 2025 йилнинг шу ярим йилидан кўпми ёки камми? Иккаласининг рақамини беринг'

