    sql: SELECT year, COUNT(*) AS n FROM deals WHERE year IN (2025, 2026) AND (month < 10 OR (month = 10 AND day(deal_date) <= 30)) GROUP BY year ORDER BY year
    key:
    - year
    - n
    sql_check: SELECT year(deal_date) AS year, COUNT(*) AS n FROM deals WHERE deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-10-30' OR deal_date BETWEEN DATE '2026-01-01' AND DATE '2026-10-30' GROUP BY 1 ORDER BY 1
