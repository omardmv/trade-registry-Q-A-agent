    uz_cyrl: 280126 рақамли экспорт битими неча долларлик бўлган ва харидор пулни қачон ўтказган?
- id: k003
  split: fresh4
  subject: deals
  shape: count
  answerable: true
  intent: 'Number of deals in 2024 with warehouses in Namangan region (status not specified: all deals, or without annulled)'
  readings:
  - name: all deals
    sql: SELECT COUNT(*) AS n FROM deals WHERE region = 'Namangan viloyati' AND year = 2024
    key:
    - n
    sql_check: SELECT COUNT(*) AS n FROM deals WHERE region = 'Namangan viloyati' AND deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  - name: without annulled
    sql: SELECT COUNT(*) AS n FROM deals WHERE region = 'Namangan viloyati' AND year = 2024 AND NOT is_cancelled
    key:
    - n
    sql_check: SELECT COUNT(*) AS n FROM deals WHERE region = 'Namangan viloyati' AND deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31' AND status <> 'Аннулирован(Не оплачен)'
  questions:
    ru: Сколько всего сделок прошло в 2024 году по складам Наманганской области? Хокимияту нужна цифра
    uz_latn: 2024-yilda Namangan viloyati omborlari boyicha jami nechta bitim bolgan? Hokimiyatga raqam kerak edi
    uz_cyrl: 2024 йилда Наманган вилояти омборлари бўйича жами нечта битим бўлган? Ҳокимиятга рақам керак эди
