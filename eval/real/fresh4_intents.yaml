- id: k015
  split: fresh4
  subject: deals
  shape: compare_periods
  answerable: true
  intent: Tonnes of petroleum bitumen sold in 2024 versus 2025, excluding annulled
  readings:
  - name: 2024 vs 2025
    sql: SELECT year, SUM(volume_tonnes) AS tonnes FROM deals WHERE product_canonical = 'Битум нефтяной' AND year IN (2024, 2025) AND NOT is_cancelled GROUP BY year ORDER BY year
    key:
    - year
    - tonnes
    sql_check: SELECT year(deal_date) AS year, SUM(quantity * lot) AS tonnes FROM deals WHERE product_canonical = 'Битум нефтяной' AND unit = 'тонна' AND status <> 'Аннулирован(Не оплачен)' AND (deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31' OR deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31') GROUP BY 1 ORDER BY 1
  questions:
    ru: Битума в 2025 году продали больше тонн, чем в 2024? Без аннулированных, цифры по обоим годам
    uz_latn: Bitum 2025-yilda 2024-yilga qaraganda kop tonna sotilganmi? Bekor bolganlarsiz, ikkala yilning raqamini bering
    uz_cyrl: Битум 2025 йилда 2024 йилга қараганда кўп тонна сотилганми? Бекор бўлганларсиз, иккала йилнинг рақамини беринг
- id: k016
  split: fresh4
  subject: deals
  shape: compare_periods
  answerable: true
  intent: 'Number of deals from 1 January to 30 October in 2025 versus 2026 (status not specified: all deals, or without annulled)'
  readings:
