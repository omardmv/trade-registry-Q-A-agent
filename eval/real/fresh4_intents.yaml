- id: k009
  split: fresh4
  subject: deals
  shape: share
  answerable: true
  intent: Share (%) of partially executed deals among all deals of 2025
  readings:
  - name: all 2025 deals
    sql: SELECT 100.0 * COUNT(*) FILTER (WHERE status = 'Исполнен(Частично)') / COUNT(*) AS pct FROM deals WHERE year = 2025
    key:
    - pct
    sql_check: SELECT 100.0 * SUM(CASE WHEN status LIKE '%Частично%' THEN 1 ELSE 0 END) / COUNT(*) AS pct FROM deals WHERE deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
  questions:
    ru: Какой процент сделок 2025 года исполнен только частично, то есть оплатили, а привезли не всё?
    uz_latn: 2025-yildagi bitimlarning necha foizi faqat qisman bajarilgan, yaʼni pul tolangan-u, mol toliq keltirilmagan?
    uz_cyrl: 2025 йилдаги битимларнинг неча фоизи фақат қисман бажарилган, яъни пул тўланган-у, мол тўлиқ келтирилмаган?
- id: k010
  split: fresh4
  subject: deals
  shape: share
  answerable: true
  intent: Share (%) of Khorezm region in wheat tonnes sold in 2024, excluding annulled
  readings:
  - name: without annulled
    sql: SELECT 100.0 * SUM(volume_tonnes) FILTER (WHERE region = 'Xorazm viloyati') / SUM(volume_tonnes) AS pct FROM deals WHERE product_canonical = 'Пшеница' AND year = 2024 AND NOT is_cancelled
    key:
    - pct
    sql_check: SELECT 100.0 * (SELECT SUM(quantity * lot) FROM deals WHERE product_canonical = 'Пшеница' AND unit = 'тонна' AND region = 'Xorazm viloyati' AND status <> 'Аннулирован(Не оплачен)' AND year = 2024) / (SELECT SUM(quantity * lot) FROM deals WHERE product_canonical = 'Пшеница' AND unit = 'тонна' AND status <> 'Аннулирован(Не оплачен)' AND year = 2024) AS pct
  questions:
    ru: Я торгую пшеницей. Какая доля хорезмских складов в тоннаже пшеницы за 2024 год, без аннулированных сделок?
    uz_latn: Men bugdoy savdosi bilan shugʻullanaman. 2024-yilda sotilgan bugdoy tonnasining necha foizi Xorazm omborlariga toʻgʻri keladi? Bekor bolgan bitimlarsiz
    uz_cyrl: Мен буғдой савдоси билан шуғулланаман. 2024 йилда сотилган буғдой тоннасининг неча фоизи Хоразм омборларига тўғри келади? Бекор бўлган битимларсиз
- id: k011
  split: fresh4
  subject: deals
  shape: top_n
  answerable: true
  intent: Top 3 buyers of polyethylene by tonnes in 2024, excluding annulled (INN and name)
  readings:
  - name: without annulled
    sql: SELECT d.buyer_inn, p.name, SUM(d.volume_tonnes) AS tonnes FROM deals d JOIN participants p ON p.inn = d.buyer_inn WHERE d.product_canonical = 'Полиэтилен' AND d.year = 2024 AND NOT d.is_cancelled GROUP BY d.buyer_inn, p.name ORDER BY tonnes DESC LIMIT 3
    key:
    - buyer_inn
    - name
    sql_check: SELECT buyer_inn, (SELECT name FROM participants WHERE inn = buyer_inn) AS name, SUM(quantity * lot) AS tonnes FROM deals WHERE product_canonical = 'Полиэтилен' AND unit = 'тонна' AND status <> 'Аннулирован(Не оплачен)' AND deal_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31' GROUP BY buyer_inn ORDER BY tonnes DESC LIMIT 3
  questions:
    ru: Пишу курсовую по полимерам. Назовите тройку крупнейших покупателей полиэтилена за 2024 год по тоннам (не считая аннулированные), с ИНН
    uz_latn: Polimerlar boyicha kursovoy yozyapman. 2024-yilda polietilenni eng kop tonna olgan uchta xaridorni ayting (bekor bolganlarsiz), STIRi bilan
    uz_cyrl: Полимерлар бўйича курсовой ёзяпман. 2024 йилда полиэтиленни энг кўп тонна олган учта харидорни айтинг (бекор бўлганларсиз), СТИРи билан
