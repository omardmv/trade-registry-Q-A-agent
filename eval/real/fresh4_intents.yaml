# Fresh evaluation set 4: written from the data (data/README.md, data_dictionary, the DuckDB tables) only,
# independently of the system; asks what different real users would type (wheat trader, fuel-station owner, accountant,
# hokimiyat official, student, journalist). Same format as intents.yaml; split "fresh4" for all.
# Check: uv run python -m eval.real.check_intents --file eval/real/fresh4_intents.yaml
# Run:   uv run python -m eval.real.run --intents eval/real/fresh4_intents.yaml --split fresh4

- id: k001
  split: fresh4
  subject: deals
  shape: lookup
  answerable: true
  intent: Product and amount of deal No. 350321
  readings:
  - name: product and amount
    sql: SELECT product_canonical, amount FROM deals WHERE deal_id = 350321
    key:
    - product_canonical
    - amount
    sql_check: SELECT c.product_canonical, d.amount FROM deals d JOIN contracts c ON c.contract_id = d.contract_id WHERE d.deal_id = 350321
  questions:
    ru: Подскажите по сделке 350321 — что там за товар и на какую сумму сошлись?
    uz_latn: 350321-bitim bo'yicha ayting-chi, qanaqa tovar sotilgan va qancha pulga kelishilgan?
    uz_cyrl: 350321-битим бўйича айтингчи, қанақа товар сотилган ва қанча пулга келишилган?
- id: k002
  split: fresh4
  subject: deals
  shape: lookup
  answerable: true
  intent: Amount in US dollars and payment date of export deal No. 280126
