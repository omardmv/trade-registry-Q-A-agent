    - n
    sql_check: SELECT year(deal_date) AS year, COUNT(*) AS n FROM deals WHERE status <> 'Аннулирован(Не оплачен)' AND (deal_date BETWEEN DATE '2025-01-01' AND DATE '2025-10-30' OR deal_date BETWEEN DATE '2026-01-01' AND DATE '2026-10-30') GROUP BY 1 ORDER BY 1
