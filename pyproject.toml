[project]
name = "uzex-qa"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-genai>=1.0",
  "sqlglot>=25",
  "pyyaml>=6",
  "rapidfuzz>=3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY)"]
addopts = "-m 'not live'"
