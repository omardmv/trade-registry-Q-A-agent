[project]
name = "uzex-qa"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlglot>=25",
  "pyyaml>=6",
  "rapidfuzz>=3",
  "numpy>=2.5.4",
  "openai>=1.40",
  "pymorphy3>=2.0.6",
  "pymorphy3-dicts-ru>=2.4.417150.4580142",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real OpenAI API (needs OPENAI_API_KEY)", "max_safety: runs with UZEX_SAFETY=max (the default in production)",
           "word_classifier: runs with UZEX_WORD_CLASSIFIER=1 (the default in production)"]
addopts = "-m 'not live'"
