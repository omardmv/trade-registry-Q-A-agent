# Closed vocabulary of the questions the data can answer (app/plan/vocab.py).
#
# Entries are written as people write them (Cyrillic or Latin); the loader turns them into normalize_text tokens
# (Latin, lower case, no apostrophes). Uzbek Cyrillic spellings need no separate entry when they transliterate to
# the Latin one (ўқғҳ -> o q g h, ц -> s, initial е -> ye are folded by the matcher).
#
#   function: closed lists of function / question / filler words. Exact tokens (no prefix matching), so a short
#             word never makes a longer unknown word known ("olti" six does not cover "oltin" gold).
#   domain:   curated domain words and synonyms beyond the field labels, glossary and catalog. Stemmed like the
#             automatic sources: a word known from its stem covers its inflections (bitim -> bitimlar).
#   An entry ending in * is a stem as written (prefix match, at least 4 letters).
#
# Deliberately absent: future-tense words (будет, завтра) - the data is a historical registry; and anything the
# data has no facts about. When a real question is refused for an ordinary word, add the word here.

